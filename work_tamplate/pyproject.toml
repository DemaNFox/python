[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
fix = true
select = ["ALL"]
ignore = ["D100", "D101", "D102", "ANN101", "ANN102"]
exclude = ["venv", ".venv", "__pycache__", "build", "dist"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
show_error_codes = true

[tool.ruff.lint]
extend-select = ["F401", "F841", "B", "E", "W", "I"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
